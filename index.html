<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Explicit Base Tag for GitHub Pages -->
  <base href="/fintrack-PWA/" />

  <!-- Relative asset links (no leading slashes) -->
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <title>FinTrack PWA</title>
</head>
<body>
  <div id="app">
    <!-- Security PIN Modal wrapped in a form to fix Chrome DOM warning -->
    <div id="pinModal" class="modal hidden">
      <form id="pinForm" class="modal-content" onsubmit="return false;">
        <h3>Security PIN Required</h3>
        <input 
          type="password" 
          id="pinInput" 
          maxlength="6" 
          placeholder="Enter PIN" 
          autocomplete="current-password" 
        />
        <button type="submit" id="pinUnlockBtn">Unlock</button>
      </form>
    </div>

    <!-- PWA Install Banner -->
    <div id="pwaInstallPrompt" class="pwa-prompt hidden">
      <p>Install FinTrack on your home screen for quick access.</p>
      <div class="pwa-actions">
        <button id="btnInstallYes" class="btn-primary">Install</button>
        <button id="btnInstallLater" class="btn-secondary">Later</button>
        <button id="btnInstallNo" class="btn-flat">No</button>
      </div>
    </div>

    <!-- Application Structure -->
    <header>
      <h1>FinTrack</h1>
      <div id="userPill">Not Logged In</div>
    </header>
    <main id="mainContent">
      <!-- Content renders dynamically via app.js -->
    </main>
  </div>

  <!-- Relative JS Module import -->
  <script type="module" src="app.js"></script>
</body>
</html>
